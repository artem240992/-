name: exam_app
description: Тестирование по экзаменационным билетам
publish_to: 'none'
version: 1.2.8+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  file_picker: ^10.3.8
  cupertino_icons: ^1.0.6
  flutter_secure_storage: ^9.2.2
  yandex_auth: ^1.2.0
  yandex_disk: ^0.1.1
  dio: 4.0.6
  path_provider: ^2.1.1
  file: ^7.0.1
  flutter_launcher_icons: ^0.14.1
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  archive: ^4.7.1
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

# ==================== НАСТРОЙКА ИКОНКИ ====================
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"     # имя иконки для Android
  adaptive_icon_background: "#312E81"   # фон адаптивной иконки
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  min_sdk_android: 21

# ==================== НАСТРОЙКА НАТИВНОЙ ЗАСТАВКИ ====================
flutter_native_splash:
  color: "#F4F5F7" # Цвет фона (совпадает с цветом приложения)
  image: "assets/splash.png"
  android_12:
    image: "assets/splash.png"
    color: "#F4F5F7"

flutter:
  uses-material-design: true
  assets:
    - assets/ # Подключаем папку с картинками