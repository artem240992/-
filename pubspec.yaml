name: exam_app
description: Тестирование по экзаменационным билетам
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  file_picker: ^10.3.8
  cupertino_icons: ^1.0.6
  flutter_rustore_pay: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# ==================== НАСТРОЙКА ИКОНКИ ====================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

# ==================== НАСТРОЙКА НАТИВНОЙ ЗАСТАВКИ ====================
flutter_native_splash:
  color: "#F4F5F7" # Цвет фона (совпадает с цветом приложения)
  image: "assets/splash.png"
  android_12:
    image: "assets/splash.png"
    color: "#F4F5F7"

flutter:
  uses-material-design: true
  assets:
    - assets/ # Подключаем папку с картинками